# PiBench — uses the EXISTING shared PostgreSQL and Caddy. Creates neither.
services:
  pibench:
    build: ./app
    image: pibench:1.0.0
    container_name: pibench
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
    # Loopback only: lets the runner on the Pi host upload results.
    # Public traffic goes Cloudflared -> Caddy -> pibench:3000 over the shared network.
    ports:
      - "127.0.0.1:8095:3000"
    networks:
      - shared
      - shareddb
    mem_limit: 128m

networks:
  shared:
    external: true
    name: ${SHARED_NETWORK:-shared-web}
  shareddb:
    external: true
    name: ${SHARED_DB:-shared-db}
